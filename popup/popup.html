<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 280px;
        background: #1a1a1a;
        color: #fff;
        font-family: system-ui, sans-serif;
        padding: 20px;
        margin: 0;
        border-radius: 12px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, #6e48aa, #9d50bb);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }
      .card {
        background: #242424;
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 12px;
      }
      .label {
        font-size: 11px;
        color: #888;
        margin-bottom: 4px;
      }
      .count {
        font-size: 28px;
        font-weight: 500;
        color: #9d50bb;
      }
      .url {
        font-size: 12px;
        color: #bbb;
        font-family: monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 6px;
      }
      .clear-btn {
        width: 100%;
        padding: 9px;
        background: transparent;
        border: 0.5px solid #444;
        border-radius: 8px;
        color: #888;
        font-size: 12px;
        cursor: pointer;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #4caf50;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="icon">⬇</div>
      <div>
        <div style="font-size: 15px; font-weight: 500">CanvasYoink</div>
        <div style="font-size: 11px; color: #888">v1.0</div>
      </div>
    </div>

    <div
      class="card"
      style="display: flex; align-items: center; justify-content: space-between"
    >
      <div>
        <div class="label">lectures captured</div>
        <div class="count" id="count">0</div>
      </div>
      <div class="dot"></div>
    </div>

    <div class="card">
      <div class="label">captured urls</div>
      <div id="url-list"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
